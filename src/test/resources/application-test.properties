spring.datasource.url=${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/movie_ticket_booking_test}
spring.datasource.username=${TEST_DATABASE_USERNAME:movie_user}
spring.datasource.password=${TEST_DATABASE_PASSWORD:movie_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

booking.default-hold-minutes=5
