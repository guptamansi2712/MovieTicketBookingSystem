spring.application.name=movie-ticket-booking-system

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/movie_ticket_booking}
spring.datasource.username=${DATABASE_USERNAME:movie_user}
spring.datasource.password=${DATABASE_PASSWORD:movie_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

booking.default-hold-minutes=5
